query Media($mediaId: Int, $page: Int, $perPage: Int) {
  Media(id: $mediaId) {
    id
    characters(page: $page, perPage: $perPage, sort: [RELEVANCE]) {
      pageInfo {
        hasNextPage
        currentPage
      }
      edges {
        id
        role
        name
        node {
          id
          name {
            full
            native
          }
          image {
            large
            medium
          }
        }
      }
    }
  }
}
