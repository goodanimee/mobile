mutation SaveMediaListEntry(
  $mediaId: Int
  $progress: Int
  $progressVolumes: Int
  $status: MediaListStatus
  $startedAt: FuzzyDateInput
  $completedAt: FuzzyDateInput
  $score: Float
  $repeat: Int
  $private: Boolean
  $hiddenFromStatusLists: Boolean
  $notes: String
) {
  SaveMediaListEntry(
    mediaId: $mediaId
    progress: $progress
    progressVolumes: $progressVolumes
    repeat: $repeat
    status: $status
    startedAt: $startedAt
    completedAt: $completedAt
    score: $score
    private: $private
    hiddenFromStatusLists: $hiddenFromStatusLists
    notes: $notes
  ) {
    id
    status
    progress
    progressVolumes
    score(format: POINT_10_DECIMAL)
    repeat
    private
    hiddenFromStatusLists
    notes
    startedAt {
      day
      month
      year
    }
    completedAt {
      day
      month
      year
    }
  }
}
