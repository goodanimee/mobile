query MediaList($userId: Int, $type: MediaType, $sort: [MediaListSort]) {
    MediaListCollection(userId: $userId, type: $type, sort: $sort) {
        hasNextChunk
        lists {
            name
            status
            entries {
                media {
                    id
                    title {
                        english
                        native
                        romaji
                        userPreferred
                    }
                    averageScore
                    bannerImage
                    coverImage {
                        medium
                        large
                        extraLarge
                        color
                    }
                    description(asHtml: true)
                    duration
                    episodes
                    format
                    genres
                    isAdult
                    isFavourite
                    popularity
                    season
                    seasonYear
                    status
                    synonyms
                    meanScore
                    favourites
                    siteUrl
                    startDate {
                        day
                        month
                        year
                    }
                    endDate {
                        day
                        month
                        year
                    }
                    trailer {
                        id
                        site
                        thumbnail
                    }
                }
                progress
                repeat
                status
                score
                startedAt {
                    day
                    month
                    year
                }
                completedAt {
                    day
                    month
                    year
                }
            }
        }
    }
}
