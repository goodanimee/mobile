query MediaList($userId: Int, $type: MediaType, $sort: [MediaListSort]) {
    MediaListCollection(userId: $userId, type: $type, sort: $sort) {
        lists {
            name
            status
            entries {
                id
                media {
                    id
                    type
                    averageScore
                    episodes
                    chapters
                    format
                    isAdult
                    isFavourite
                    siteUrl
                    title {
                        english
                        native
                        romaji
                        userPreferred
                    }
                    coverImage {
                        color
                        medium
                        large
                        extraLarge
                    }
                }
                progress
                progressVolumes
                repeat
                status
                score(format: POINT_10_DECIMAL)
                startedAt {
                    day
                    month
                    year
                }
                completedAt {
                    day
                    month
                    year
                }
            }
        }
    }
}
