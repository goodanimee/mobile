syntax = "proto3";

package goodanime;

import "common.proto";
import "media_min.proto";

option go_package = "goodanime/backend/proto";

message StaffName {
  string full = 1;
  optional string native = 2;
  optional string user_preferred = 3;
}

message StaffImage {
  optional string large = 1;
  optional string medium = 2;
}

message StaffMin {
  int32 id = 1;
  StaffName name = 2;
  StaffImage image = 3;
  optional string language_v2 = 4;
}

message StaffEdge {
  string role = 1;
  StaffMin node = 2;
}

message StaffConnection {
  repeated StaffEdge edges = 1;
  PageInfo page_info = 2;
}

message StaffCharacterName {
  optional string user_preferred = 1;
}

message StaffCharacterImage {
  optional string large = 1;
  optional string medium = 2;
}

message StaffCharacter {
  int32 id = 1;
  optional StaffCharacterName name = 2;
  optional StaffCharacterImage image = 3;
}

message StaffCharacterMediaEdge {
  optional string character_role = 1;
  MediaMin node = 2;
  repeated StaffCharacter characters = 3;
}

message StaffCharacterMediaConnection {
  repeated StaffCharacterMediaEdge edges = 1;
  PageInfo page_info = 2;
}

message StaffMediaEdge {
  optional string staff_role = 1;
  MediaMin node = 2;
}

message StaffMediaConnection {
  repeated StaffMediaEdge edges = 1;
  PageInfo page_info = 2;
}

message Staff {
  int32 id = 1;
  StaffName name = 2;
  StaffImage image = 3;
  optional string description = 4;
  optional int32 favourites = 5;
  optional bool is_favourite = 6;
  optional int32 age = 7;
  optional string gender = 8;
  repeated int32 years_active = 9;
  optional string home_town = 10;
  optional string blood_type = 11;
  repeated string primary_occupations = 12;
  optional FuzzyDate date_of_birth = 13;
  optional FuzzyDate date_of_death = 14;
  optional string language = 15;
  StaffCharacterMediaConnection character_media = 16;
  StaffMediaConnection staff_media = 17;
}
