name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "semver=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag
        id: tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.exists == 'false'

      - uses: docker/login-action@v3
        if: steps.tag.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/goodanime-builder:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/goodanime-builder:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/goodanime-builder:cache,mode=max

      - uses: actions/cache@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}

      - name: Write .env
        if: steps.tag.outputs.exists == 'false'
        run: echo "ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}" > .env

      - name: Build
        if: steps.tag.outputs.exists == 'false'
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -v $HOME/.pub-cache:/root/.pub-cache \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/goodanime-builder:latest \
            sh -c "flutter pub get && flutter build apk --release && flutter build appbundle --release"

      - name: Stage artifacts
        if: steps.tag.outputs.exists == 'false'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             goodanime_v${{ steps.version.outputs.semver }}.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             goodanime_v${{ steps.version.outputs.semver }}.aab

      - name: Resolve compare URL
        id: compare
        if: steps.tag.outputs.exists == 'false'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TAG=${{ steps.version.outputs.tag }}
          if [ -n "$PREV" ]; then
            echo "body=[Commits ${PREV} → ${TAG}](https://github.com/${{ github.repository }}/compare/${PREV}...${TAG})" >> $GITHUB_OUTPUT
          else
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.compare.outputs.body }}
          generate_release_notes: false
          files: |
            goodanime_v${{ steps.version.outputs.semver }}.apk
            goodanime_v${{ steps.version.outputs.semver }}.aab
